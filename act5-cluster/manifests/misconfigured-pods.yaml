# act5-cluster/manifests — DELIBERATELY misconfigured pods. One per act3 row.
# Applied by 01-kind.sh. Every one of these is a finding a cluster scanner
# must flag; attendees predict exploitability with act4's matrix BEFORE
# any scanner runs.
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  labels: { lab: act5, risk: node-exposure }
spec:
  containers:
  - name: busybox
    image: busybox:stable
    command: ["sleep", "3600"]
    securityContext:
      privileged: true            # act3 row: the whole bundle — every escape enabled
---
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  labels: { lab: act5, risk: host-filesystem }
spec:
  containers:
  - name: busybox
    image: busybox:stable
    command: ["sleep", "3600"]
    securityContext: {}
    volumeMounts:
    - { name: escape-door, mountPath: /host-tmp }
  volumes:
  - name: escape-door
    hostPath: { path: /tmp }       # act2/02 bridge 3: a host path, by REQUEST
---
apiVersion: v1
kind: Pod
metadata:
  name: sysadmin-cap-pod
  labels: { lab: act5, risk: capability-grant }
spec:
  containers:
  - name: busybox
    image: busybox:stable
    command: ["sleep", "3600"]
    securityContext:
      privileged: false
      capabilities:
        add: [SYS_ADMIN]          # act3 row: the one capability every technique needs
---
apiVersion: v1
kind: Pod
metadata:
  name: hostpid-pod
  labels: { lab: act5, risk: shared-process-table }
spec:
  containers:
  - name: busybox
    image: busybox:stable
    command: ["sleep", "3600"]
    securityContext: {}
  hostPID: true                    # act2/02 bridge 2: /proc/<pid>/root handed to the pod
